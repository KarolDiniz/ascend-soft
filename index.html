<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#d8ebe4" />
    <meta name="description" content="Ascend Soft — torre sensorial ASMR. Suba. Pouse. Ouça." />
    <title>Ascend Soft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app" class="is-title">
      <canvas id="game" aria-label="Ascend Soft"></canvas>

      <div id="ui" class="ui">
        <header id="hud" class="hud hidden" aria-live="polite">
          <div class="hud-block">
            <span class="hud-label">altura</span>
            <span id="hud-height" class="hud-value">0</span>
          </div>
          <div class="hud-block hud-block--center">
            <span id="hud-streak" class="hud-streak hidden"></span>
            <span class="hud-label">respiros</span>
            <span id="hud-breaths" class="hud-value hud-value--sm">0</span>
          </div>
          <div class="hud-block hud-block--right">
            <span class="hud-label">melhor</span>
            <span id="hud-best" class="hud-value">0</span>
          </div>
        </header>

        <div id="material-toast" class="material-toast hidden" aria-live="polite" role="status">
          <div class="toast-banner-layout">
            <div id="toast-speaker-panel" class="toast-speaker-panel" aria-hidden="true">
              <canvas id="toast-speaker" class="toast-speaker" width="128" height="152"></canvas>
            </div>
            <div class="toast-banner-body">
              <div class="toast-banner-head">
                <span class="toast-eyebrow">reflexão</span>
                <span id="toast-phase" class="toast-phase"></span>
              </div>
              <blockquote class="toast-quote-wrap">
                <p id="toast-quote" class="toast-quote"></p>
              </blockquote>
            </div>
          </div>
          <div class="toast-progress" aria-hidden="true"></div>
        </div>

        <section id="title-screen" class="overlay title-screen">
          <div class="title-veil" aria-hidden="true"></div>
          <div class="title-floaters" aria-hidden="true">
            <span class="floater floater--a"></span>
            <span class="floater floater--b"></span>
            <span class="floater floater--c"></span>
            <span class="floater floater--d"></span>
            <span class="floater floater--e"></span>
          </div>

          <button
            id="btn-settings"
            class="title-settings-btn"
            type="button"
            aria-label="Configurações"
            aria-expanded="false"
            aria-controls="title-settings"
          >
            <svg class="settings-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <rect x="6" y="1" width="4" height="2" fill="currentColor" />
              <rect x="6" y="13" width="4" height="2" fill="currentColor" />
              <rect x="1" y="6" width="2" height="4" fill="currentColor" />
              <rect x="13" y="6" width="2" height="4" fill="currentColor" />
              <rect x="3" y="3" width="2" height="2" fill="currentColor" />
              <rect x="11" y="3" width="2" height="2" fill="currentColor" />
              <rect x="3" y="11" width="2" height="2" fill="currentColor" />
              <rect x="11" y="11" width="2" height="2" fill="currentColor" />
              <rect x="5" y="5" width="6" height="6" fill="currentColor" />
              <rect x="6" y="6" width="4" height="4" fill="#f7f1ea" />
            </svg>
          </button>

          <div id="title-settings" class="title-settings hidden" aria-hidden="true">
            <button
              id="title-settings-backdrop"
              class="title-settings-backdrop"
              type="button"
              aria-label="Fechar configurações"
              tabindex="-1"
            ></button>
            <div
              id="title-settings-panel"
              class="title-settings-panel title-panel"
              role="dialog"
              aria-modal="true"
              aria-labelledby="settings-title"
            >
              <div class="title-settings-head">
                <h2 id="settings-title" class="settings-title">Configurações</h2>
                <button id="btn-settings-close" class="btn-settings-close" type="button" aria-label="Fechar">
                  ×
                </button>
              </div>
              <label class="setting-row">
                <input id="light-mode" type="checkbox" />
                <span class="setting-label">
                  <span class="setting-title">Modo leve</span>
                  <span class="setting-hint">menos partículas · ideal p/ celular</span>
                </span>
              </label>
            </div>
          </div>

          <div class="title-stack">
            <div class="title-hero">
              <p class="eyebrow">torre sensorial</p>
              <h1 class="brand">Ascend<br />Soft</h1>
              <p class="tagline">Pouse. Ouça. Suba de novo.</p>
              <p id="title-best" class="title-best hidden" aria-live="polite"></p>
            </div>

            <div class="title-panel">
              <button id="btn-start" class="btn btn-primary btn-soap btn-start" type="button">
                Subir
              </button>
              <p class="press-blink" aria-hidden="true">aperte subir</p>
              <div class="audio-row">
                <button id="btn-mute" class="btn btn-ghost" type="button" aria-pressed="false">
                  Som
                </button>
                <label class="volume">
                  <span class="sr-only">Volume</span>
                  <input id="volume" type="range" min="0" max="100" value="55" />
                </label>
              </div>
              <p class="hint">← → mover · espaço pular</p>
            </div>
          </div>
        </section>

        <section id="fall-screen" class="overlay fall-screen hidden">
          <div class="title-panel fall-panel">
            <p class="fall-title">quase…</p>
            <p id="fall-score" class="fall-score">altura 0</p>
            <button id="btn-retry" class="btn btn-primary btn-soap" type="button">de novo</button>
          </div>
        </section>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
